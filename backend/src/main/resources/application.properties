server.port=8082
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/electromart?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:replace-this-demo-secret-with-a-long-random-secret-key}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
